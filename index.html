*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: 한 열 작업 보드. 상단 요약, 확인 요청 목록, 탭별 소재 구성, 하단 규격 */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --ink:#161616; --mute:#6A6A66; --line:#E0E0DC; --soft:#ECECE8;
  --ph:#D9D9D4; --red:#D02A1B; --ok:#1C7646; --okbg:#E5F1EA; --fixbg:#FBE8E5; --focus:#161616;
  --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:ui-monospace,'SF Mono',Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121211; --surface:#1B1B1A; --ink:#ECECE9; --mute:#9B9B96; --line:#2F2F2D; --soft:#252523;
  --ph:#3A3A37; --red:#FF6B57; --ok:#62CC93; --okbg:#173222; --fixbg:#3B1D18; --focus:#ECECE9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1B1B1A; --ink:#ECECE9; --mute:#9B9B96; --line:#2F2F2D; --soft:#252523;
  --ph:#3A3A37; --red:#FF6B57; --ok:#62CC93; --okbg:#173222; --fixbg:#3B1D18; --focus:#ECECE9; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;letter-spacing:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px;display:flex;flex-direction:column;gap:40px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:28px;line-height:1.25}
h2{font-size:18px;display:flex;align-items:baseline;gap:10px}
h2 small{font-size:13px;color:var(--mute);font-weight:400}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.mono{font-family:var(--mono);font-size:12.5px}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.head{display:flex;flex-direction:column;gap:10px}
.head p{margin:0;max-width:68ch}
.stats{display:flex;flex-wrap:wrap;gap:12px 32px;padding-top:6px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.stat.fix b{color:var(--red)}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--ink)}
.sched div{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.sched .d{font-variant-numeric:tabular-nums;font-weight:600}
.sched .key .d{color:var(--red)}
.sched .past{opacity:.45}
.panel{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.mode{font-size:12px;color:var(--mute)}
.mode.on{color:var(--ok)}
.qlist{border-top:1px solid var(--ink)}
.q{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.who{font-size:12px;font-weight:600;padding:2px 8px;border:1px solid var(--line);border-radius:999px;justify-self:start;white-space:nowrap}
.qt{min-width:0}
.qt b{font-weight:600}
.qt p{margin:2px 0 0;color:var(--mute);font-size:13px}
.q .note{grid-column:2/4}.sec .note{grid-column:1/-1}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.ctrl .role{font-size:12px;color:var(--mute);margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].ok{background:var(--okbg);color:var(--ok);font-weight:600}
.seg button[aria-pressed="true"].fix{background:var(--fixbg);color:var(--red);font-weight:600}
.state{font-size:12.5px;padding:3px 10px;border-radius:6px;background:var(--soft);color:var(--mute);white-space:nowrap}
.state.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.state.fix{background:var(--fixbg);color:var(--red);font-weight:600}
.at{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:38px;resize:vertical;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.notetext{font-size:13px;margin:0;padding:8px 10px;background:var(--soft);border-radius:6px;white-space:pre-wrap}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ink);padding-top:6px}
.tabs button{border:0;background:transparent;padding:8px 12px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mute)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tabs .n{font-variant-numeric:tabular-nums;font-size:12px;margin-left:4px}
.tabnote{margin:0;font-size:13px;color:var(--mute)}
.set{display:flex;flex-direction:column;gap:12px}
.sethead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding-top:8px}
.sethead h3{font-size:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 16px}
.secmeta{display:flex;flex-direction:column;gap:6px;min-width:0}
.secmeta .t{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.secmeta .t b{font-size:15px}
.rule{font-size:12.5px;font-weight:600}
.rule.warn{color:var(--red)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:0;font-size:13px}
dt{color:var(--mute)}
dd{margin:0;min-width:0}
.sec .ctrl{flex-direction:column;align-items:flex-end;gap:8px}
.sec .ctrl .line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cards{grid-column:1/3;display:flex;flex-wrap:wrap;gap:18px 20px;align-items:flex-end;padding-top:4px}
.card{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:100%}
.thumb{height:110px;display:flex;align-items:flex-end}
.box{height:110px;background:var(--ph);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;max-width:100%}
.box.cut{background:repeating-conic-gradient(var(--ph) 0 25%,transparent 0 50%) 0 0/12px 12px;outline:1px dashed var(--mute);outline-offset:-1px}
.box img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.cap{display:flex;flex-direction:column;gap:2px}
.cap .mono{word-break:break-all}
.cap .sub{font-size:12px;color:var(--mute)}
.pill{align-self:flex-start;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--mute)}
.pill.final{background:var(--okbg);color:var(--ok)}
.pill.revise{background:var(--fixbg);color:var(--red)}
.dl{align-self:flex-start;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px;font-size:12px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:400;color:var(--mute);font-size:12px;padding:0 12px 6px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.warn{color:var(--red);font-weight:600}
.foot{font-size:12px;color:var(--mute)}
@media (max-width:720px){
  .q{grid-template-columns:minmax(0,1fr)}
  .q .note,.sec .note{grid-column:1}
  .ctrl{justify-content:flex-start}
  .sec{grid-template-columns:minmax(0,1fr)}
  .sec .ctrl{align-items:flex-start}
  .sec .ctrl .line{justify-content:flex-start}
  .cards{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.draft{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.06em;border:1px solid var(--ink);padding:1px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.me .lbl{font-weight:600}
.me .seg button{padding:6px 14px;font-size:13px}
.me .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.copy{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;padding:6px 14px;font-weight:600}
.copy[disabled]{opacity:.35;cursor:default}
.flash{font-size:12.5px;color:var(--ok)}
.code{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
pre.notetext{font-family:var(--sans)}
.live{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;min-width:0}
.fig{width:100%;height:440px;border:1px solid var(--line);border-radius:6px;background:var(--soft);display:block}
.livebar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:12px}
.livebar a,.tabnote a{color:var(--ink);font-weight:600}
.files{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 16px}
.files li{display:flex;flex-direction:column;min-width:0;padding:6px 0;border-top:1px solid var(--line)}
.files .mono{word-break:break-all}
.files .sub{font-size:12px;color:var(--mute)}
@media (max-width:720px){.live{grid-column:1}.fig{height:300px}}

</style>

  {id:'women',label:'넾다세일 여성',sets:[{id:'NDS_W',title:'넾다세일 여성',landing:'L2 여성 기획전 (확정)',period:P,formats:['IMG','NAT','FEED'],groups:g('여')}]},
  {id:'key',label:'주력아이템',note:'A-D 배정안: A M1DJ82A1 · B M1JK8202 · C M1JP81A1 · D M1JP81A2 (확정 전)',sets:[key('KEY_A','A','M1DJ82A1','여','299,000원 · 40%'),key('KEY_B','B','M1JK8202','여','149,000원 · 17%'),key('KEY_C','C','M1JP81A1','남','69,900원 · 56%'),key('KEY_D','D','M1JP81A2','남','79,900원 · 55%')]},
  {id:'bd',label:'브랜드데이',note:'11/1(일) 하루 집행. 리워드 쿠폰은 11/1(일)부터 소진 시까지.',sets:[
    {id:'BD_M',title:'브랜드데이 남성',landing:'남성 브랜드데이 랜딩 네이버 확인 중',period:'11/1(일)',formats:['IMG','NAT','FEED'],groups:gBD('남')},
    {id:'BD_W',title:'브랜드데이 여성',landing:'L2 여성 기획전 (확정, 넾다세일 여성과 동일)',period:'11/1(일)',formats:['IMG','NAT','FEED'],groups:gBD('여')}]},
  {id:'boost',label:'추가 부스트',sets:[
    {id:'META',title:'Meta',landing:'그로스팀 확인',period:P,custom:{label:'Meta 1000x1000',rule:'이미지 글자 규정 미기재',frames:[
      {name:'META_M_1000x1000',w:1000,h:1000,ext:'jpg',sub:'전환 IG 남 20-39'},
      {name:'META_W_1000x1000',w:1000,h:1000,ext:'jpg',sub:'전환 IG 여 20-39'},
      {name:'META_ASC_1000x1000',w:1000,h:1000,ext:'jpg',sub:'ASC 전환수 · 전환값'}],group:'전환 IG 남 · 여 20-39, ASC 2개 그룹'}},
    {id:'GDG',title:'Google 디맨드젠',landing:'그로스팀 확인',period:P,custom:{label:'Google 디맨드젠',rule:'이미지 글자 규정 미기재',frames:[
      {name:'GDG_1200x628',w:1200,h:628,ext:'jpg'},{name:'GDG_1200x1200',w:1200,h:1200,ext:'jpg'},{name:'GDG_960x1200',w:960,h:1200,ext:'jpg'}],group:'디맨드젠 DA 전환 · 패션 관심 남녀 20-44'}}]},
  {id:'npay',label:'N페이',sets:[
    {id:'NPAY_POPUP',title:'주문완료 팝업',landing:'L1 또는 L2 (상품별 랜딩 불가)',sched:'타겟팅 20만 노출',roles:['md'],glabel:'지면',custom:{label:'주문완료 팝업 840x300',rule:'메인 14자 · 서브 1줄 11자 · 배경 #ffffff',frames:[{name:'NPAY_POPUP_840x300',w:840,h:300,ext:'png'}],group:'N페이 주문완료 (타겟팅)'}},
    {id:'NPAY_POINT',title:'포인트 상단 배너',landing:'L1 또는 L2 (상품별 랜딩 불가)',sched:'2주 고정 노출',roles:['md'],glabel:'지면',custom:{label:'포인트 상단 배너 120x120',rule:'PNG · 200KB 미만 · 문구 텍스트 전달',frames:[{name:'NPAY_POINT_120x120',w:120,h:120,ext:'png'}],group:'N페이 포인트 상단 (+플러스)'}},

  {id:'logo',label:'로고',sets:[

    {id:'LOGO_GDG',title:'Google 디맨드젠 로고',landing:'공통',period:P,custom:{label:'로고',rule:'로고 단독',frames:[{name:'LOGO_1200x1200',w:1200,h:1200,ext:'jpg'}],group:'디맨드젠 공통'}}]}
];
// 섹션 전개
TABS.forEach(t=>{t.secs=[];t.sets.forEach(s=>{
  if(s.custom){t.secs.push({key:s.id,set:s,label:s.custom.label,rule:s.custom.rule,warn:false,group:s.custom.group,frames:s.custom.frames});}
  else s.formats.forEach(f=>{const F=FMT[f];t.secs.push({key:s.id+'_'+f,set:s,label:F.label,rule:F.rule,warn:!!F.warn,group:s.groups[f],
    frames:F.frames.map(([w,h,ext,cut])=>({name:`${s.id}_${f}_${w}x${h}${cut?'_누끼':''}`,w,h,ext:ext||'jpg',cut:!!cut}))});});
});t.count=t.secs.reduce((a,x)=>a+x.frames.length,0);});
const ALLSECS=TABS.flatMap(t=>t.secs);
const ALLFRAMES=ALLSECS.flatMap(s=>s.frames);
const Q=[
  {key:'q_landing',role:'md',t:'주력 4종 상세 URL',d:'L1 · L2 확정. 주력아이템 상세 L3-L6 URL 요청'},
  {key:'q_bd',role:'md',t:'남성 브랜드데이 11/1(일) 랜딩',d:'여성은 L2 확정. 남성 네이버 확인 후 전달'},
  {key:'q_items',role:'md',t:'주력 4종 세일가 · 할인율',d:'주력아이템 탭 섹션별 표기 기준'},
  {key:'q_copy',role:'md',t:'할인 · 쿠폰 표기',d:'IMG · Native 이미지 내 미표기 / 쿠폰 7만 원 이상 10%, 최대 5만 원, 11/1(일)부터 소진 시까지'},
  {key:'q_coupon_jp',role:'md',t:'M1JP81A1 쿠폰 적용',d:'세일가 69,900원, 쿠폰 기준 7만 원 이상. 적용 여부'},
  {key:'q_npay_popup',role:'md',t:'N페이 주문완료 팝업',d:'이미지형 · 텍스트형 여부, 팝업 · 배너 집행 시작일'},
  {key:'q_npay_push',role:'md',t:'N페이 푸시 물량',d:'5만 건 (제안서 3천만 옵션 1만 건). 비용 변동 여부'},
  {key:'q_groups',role:'growth',t:'광고그룹별 소재 매핑',d:'섹션별 광고그룹 표기 기준'},
  {key:'q_count',role:'growth',t:'사이즈별 장수',d:'GFA · Meta · Google 사이즈당 1장 기준'},
  {key:'q_meta',role:'growth',t:'Meta 추가 비율',d:'1000x1000 외 4:5 · 9:16 추가 여부'},
  {key:'q_boost',role:'growth',t:'추가 부스트 랜딩',d:'Meta · Google 랜딩 URL'},
  {key:'q_due',role:'growth',t:'소재 전달 기한',d:'10/20(화) 세팅 · 검수 기준'}
];
const SCHED=[
  {m:10,d:20,t:'10/20(화)',l:'세팅 · 검수'},
  {m:10,d:22,t:'10/22(목)',l:'브랜드데이 소재 권장 마감'},
  {m:10,d:25,t:'10/25(일)',l:'세일가 스토어 반영'},
  {m:10,d:26,t:'10/26(월)',l:'넾다세일 오픈',key:1},
  {m:11,d:1,t:'11/1(일)',l:'브랜드데이 · 쿠폰 · 라이브',key:1},
  {m:11,d:8,t:'11/8(일)',l:'앵콜 예정 · 종료',key:1}
];
const STATUS={draft:['제작 전',''],review:['검수 요청',''],revise:['수정 필요','revise'],final:['확정','final']};

const FK='MpDJwJnq9ki4TXqeYZvVCA',FN='%EB%84%A4%EC%9D%B4%EB%B2%84%EB%84%BE%EB%8B%A4%EC%84%B8%EC%9D%BC_%EA%B4%91%EA%B3%A0%EC%86%8C%EC%9E%AC';
const NODE={NDS_M_IMG:'4:206',NDS_M_NAT:'4:214',NDS_M_FEED:'4:223',NDS_W_IMG:'4:234',NDS_W_NAT:'4:242',NDS_W_FEED:'4:251',
KEY_A_NAT:'4:262',KEY_A_FEED:'4:271',KEY_B_NAT:'4:279',KEY_B_FEED:'4:288',KEY_C_NAT:'4:296',KEY_C_FEED:'4:305',KEY_D_NAT:'4:313',KEY_D_FEED:'4:322',
BD_M_IMG:'4:333',BD_M_NAT:'4:341',BD_M_FEED:'4:350',BD_W_IMG:'4:358',BD_W_NAT:'4:366',BD_W_FEED:'4:375',META:'4:386',GDG:'4:394',LOGO_GFA:'4:405',LOGO_GDG:'4:412',NPAY_POPUP:'109:6',NPAY_POINT:'109:12',NPAY_PUSH:'109:18'};
const PAGE={men:'2:2',women:'2:3',key:'2:4',bd:'2:5',boost:'2:6',logo:'2:7',npay:'109:2'};
const figUrl=n=>`https://www.figma.com/design/${FK}/${FN}?node-id=${n.replace(':','-')}`;

let tab='men';try{const v=localStorage.getItem('nepda_tab');if(v&&TABS.some(t=>t.id===v))tab=v;}catch(e){}
const LS='nepda_review_v1';let me=null,L={reviews:{}},flash='',outText='';
try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v&&typeof v==='object'){L=v;me=v.me||null;}}catch(e){}
L.reviews=L.reviews||{};
function persist(){try{L.me=me;localStorage.setItem(LS,JSON.stringify(L));}catch(e){}}
const rv=k=>L.reviews[k]||(L.reviews[k]={});
const today=(()=>{try{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric'}).formatToParts(new Date());return{m:+p.find(x=>x.type==='month').value,d:+p.find(x=>x.type==='day').value};}catch(e){const n=new Date();return{m:n.getMonth()+1,d:n.getDate()};}})();
const QID=q=>'Q'+(Q.indexOf(q)+1);
const LAB={ok:'확인',fix:'수정 필요'};
function ctrl(k,roles,showLabel=true){
  const r=rv(k);
  return roles.map(role=>{
    const v=r[role]&&r[role].s;
    const lab=showLabel?`<span class="role">${ROLE[role]}</span>`:'';
    const body=me===role
      ?`<span class="seg" role="group" aria-label="${ROLE[role]} 확인"><button class="ok" data-a="mark" data-k="${k}" data-r="${role}" data-v="ok" aria-pressed="${v==='ok'}">확인</button><button class="fix" data-a="mark" data-k="${k}" data-r="${role}" data-v="fix" aria-pressed="${v==='fix'}">수정 필요</button></span>`
      :`<span class="state ${me===role?(v||''):''}">${me?(me===role?(LAB[v]||'미확인'):'담당 외'):'역할 선택 전'}</span>`;

function note(k,roles){if(!me||!roles.includes(me))return '';const r=rv(k);
  return `<div class="note"><textarea id="n_${k}" data-k="${k}" placeholder="의견 (선택)" rows="1">${esc(r.note||'')}</textarea></div>`;}
const RL=s=>s.set.roles||['md','growth'];const MYS=()=>ALLSECS.filter(s=>RL(s).includes(me));
function mine(){const qs=Q.filter(q=>q.role===me);let marked=0,fix=0;
  qs.forEach(q=>{const s=rv(q.key)[me];if(s){marked++;if(s.s==='fix')fix++;}});
  MYS().forEach(s=>{const x=rv(s.key)[me];if(x){marked++;if(x.s==='fix')fix++;}});
  return{total:qs.length+MYS().length,marked,fix};}
function replyText(){
  const out=[`[넾다세일 소재 사전 확인 회신] ${ROLE[me]}`];let un=0;
  const qs=Q.filter(q=>q.role===me);const ql=[];
  qs.forEach(q=>{const r=rv(q.key),s=r[me];if(!s&&!r.note){un++;return;}if(!s)un++;ql.push(`· ${QID(q)} ${q.t}: ${s?LAB[s.s]:'미표시'}${r.note?' / '+r.note:''}`);});
  const sl=[];MYS().forEach(s=>{const r=rv(s.key),x=r[me];if(!x&&!r.note){un++;return;}if(!x)un++;sl.push(`· ${s.key} ${s.label.startsWith(s.set.title)?s.label:s.set.title+' '+s.label}: ${x?LAB[x.s]:'미표시'}${r.note?' / '+r.note:''}`);});
  if(ql.length){out.push('■ 확인 요청');out.push(...ql);}
  if(sl.length){out.push('■ 소재 섹션');out.push(...sl);}
  out.push(`미표시 ${un}건`);return out.join('\n');}
function chips(s){return `<ul class="files">${s.frames.map(f=>`<li><span class="mono">${esc(f.name)}</span><span class="sub">${f.w}x${f.h} · ${f.ext}${f.cut?' · 배경 투명':''}${f.sub?' · '+esc(f.sub):''}</span></li>`).join('')}</ul>`;}
function section(s){
  const n=NODE[s.key];
  return `<article class="sec" id="sec_${s.key}">
   <div class="secmeta"><div class="t"><b>${esc(s.label)}</b><span class="rule${s.warn?' warn':''}">${esc(s.rule)}</span><span class="code">${s.key}</span></div>
   <dl><dt>${s.set.glabel||'광고그룹'}</dt><dd>${esc(s.group)}</dd><dt>랜딩</dt><dd>${esc(s.set.landing)}</dd>${s.set.price?`<dt>세일가</dt><dd>${esc(s.set.price)}</dd>`:''}${s.set.sched?`<dt>일정</dt><dd>${esc(s.set.sched)}</dd>`:''}</dl></div>
   <div class="ctrl" data-ctrl="${s.key}" data-roles="${RL(s).join(',')}">${ctrl(s.key,RL(s))}</div>
   <div class="live">${n?`<iframe class="fig" src="${embUrl(n)}" loading="lazy" allowfullscreen title="${esc(s.set.title+' '+s.label)} Figma 실시간 화면"></iframe><div class="livebar"><span></span><a href="${figUrl(n)}" target="_blank" rel="noopener">Figma에서 열기</a></div>`:''}</div>${note(s.key,RL(s))}</article>`;
}
function statsHTML(){const m=me?mine():null;return `<div class="stat"><b>${ALLFRAMES.length}<span class="mute" style="font-size:13px;font-weight:400">장</span></b><span>준비 소재</span></div><div class="stat"><b>${Q.length}</b><span>확인 요청</span></div><div class="stat"><b>${ALLSECS.length}</b><span>소재 섹션</span></div>${m?`<div class="stat"><b>${m.marked}/${m.total}</b><span>내 표시</span></div><div class="stat${m.fix?' fix':''}"><b>${m.fix}</b><span>수정 필요</span></div>`:''}`;}
function meHTML(){return `<span class="seg" role="group" aria-label="내 역할">${['md','growth'].map(r=>`<button data-a="me" data-r="${r}" aria-pressed="${me===r}">${r==='md'?'온라인팀 MD':'그로스팀'}</button>`).join('')}</span><button class="copy" data-a="copy" ${me?'':'disabled'}>회신 내용 복사</button><span class="mute" style="font-size:12.5px">역할 선택 · 항목별 표시 · 복사 후 메신저 회신</span>${flash?`<span class="flash">${esc(flash)}</span>`:''}${outText?`<pre class="notetext" style="flex-basis:100%;user-select:all">${esc(outText)}</pre>`:''}`;}
function refreshCtrl(k){document.querySelectorAll(`[data-ctrl="${k}"]`).forEach(el=>{el.innerHTML=ctrl(k,el.dataset.roles.split(','),!el.dataset.nolabel);});const st=document.getElementById('stats');if(st)st.innerHTML=statsHTML();}
function refreshMe(){const el=document.getElementById('me');if(el)el.innerHTML=meHTML();}
function render(){
  const T=TABS.find(t=>t.id===tab)||TABS[0]; const m=me?mine():null;
  const app=document.getElementById('app');
  const ae=document.activeElement; const focusId=ae&&ae.id; const sel=ae&&ae.selectionStart;
  app.innerHTML=`<div class="wrap">
  <header class="head"><span class="eyebrow">MIND BRIDGE · 2026 네이버 넾다세일</span><h1>광고 소재 사전 확인<span class="draft">DRAFT</span></h1>
   </header>
  <section class="me" id="me" aria-label="내 역할">${meHTML()}</section>
  
  <section class="panel" aria-labelledby="qh"><div class="qhead"><h2 id="qh">확인 요청</h2></div>
   <div class="qlist">${Q.map(q=>`<div class="q"><span class="who">${ROLE[q.role]}</span><div class="qt"><b>${QID(q)} ${esc(q.t)}</b><p>${esc(q.d)}</p></div><div class="ctrl" data-ctrl="${q.key}" data-roles="${q.role}" data-nolabel="1">${ctrl(q.key,[q.role],false)}</div>${note(q.key,[q.role])}</div>`).join('')}</div></section>
  <section class="panel" aria-labelledby="sh"><h2 id="sh">소재</h2>
   <div class="tabs" role="tablist">${TABS.map(t=>`<button role="tab" data-a="tab" data-t="${t.id}" aria-selected="${t.id===T.id}">${esc(t.label)}<span class="n">${t.count}</span></button>`).join('')}</div>
   ${T.id==='key'?`<p class="tabnote">A M1DJ82A1 · B M1JK8202 · C M1JP81A1 · D M1JP81A2</p>`:''}
   ${T.sets.map(st=>`<div class="set"><div class="sethead"><h3>${esc(st.title)}</h3>${st.sub?`<span class="mono">${esc(st.sub)}</span>`:''}</div>${T.secs.filter(s=>s.set===st).map(section).join('')}</div>`).join('')}
  </section>
  
  </div>`;
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel);}catch(e){}}}
}
async function copyReply(){const t=replyText();
  try{await navigator.clipboard.writeText(t);flash='복사됨. 메신저에 붙여넣어 보내주세요';outText='';}
  catch(e){flash='자동 복사가 안 돼 아래 내용을 직접 복사해 주세요';outText=t;}
  refreshMe();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='tab'){tab=b.dataset.t;try{localStorage.setItem('nepda_tab',tab);}catch(x){}render();return;}
  if(a==='me'){me=b.dataset.r;flash='';outText='';persist();render();return;}
  if(a==='mark'&&me===b.dataset.r){const r=rv(b.dataset.k),v=b.dataset.v;
    if(r[me]&&r[me].s===v)delete r[me];else r[me]={s:v};flash='';persist();refreshCtrl(b.dataset.k);return;}
  if(a==='copy'&&me){copyReply();return;}
});
document.addEventListener('input',e=>{const t=e.target;if(!t.matches('textarea[data-k]'))return;const r=rv(t.dataset.k);const v=t.value.trim();if(v)r.note=v;else delete r.note;persist();});
render();
})();

</script>
