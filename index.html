*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: 한 열 작업 보드. 상단 요약, 확인 요청 목록, 탭별 소재 구성, 하단 규격 */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --ink:#161616; --mute:#6A6A66; --line:#E0E0DC; --soft:#ECECE8;
  --ph:#D9D9D4; --red:#D02A1B; --ok:#1C7646; --okbg:#E5F1EA; --fixbg:#FBE8E5; --focus:#161616;
  --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:ui-monospace,'SF Mono',Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121211; --surface:#1B1B1A; --ink:#ECECE9; --mute:#9B9B96; --line:#2F2F2D; --soft:#252523;
  --ph:#3A3A37; --red:#FF6B57; --ok:#62CC93; --okbg:#173222; --fixbg:#3B1D18; --focus:#ECECE9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1B1B1A; --ink:#ECECE9; --mute:#9B9B96; --line:#2F2F2D; --soft:#252523;
  --ph:#3A3A37; --red:#FF6B57; --ok:#62CC93; --okbg:#173222; --fixbg:#3B1D18; --focus:#ECECE9; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;letter-spacing:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px;display:flex;flex-direction:column;gap:40px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:28px;line-height:1.25}
h2{font-size:18px;display:flex;align-items:baseline;gap:10px}
h2 small{font-size:13px;color:var(--mute);font-weight:400}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.mono{font-family:var(--mono);font-size:12.5px}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.head{display:flex;flex-direction:column;gap:10px}
.head p{margin:0;max-width:68ch}
.stats{display:flex;flex-wrap:wrap;gap:12px 32px;padding-top:6px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}

try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v&&typeof v==='object'){L=v;me=v.me||null;}}catch(e){}

  const sl=[];ALLSECS.forEach(s=>{const r=rv(s.key),x=r[me];if(!x&&!r.note){un++;return;}if(!x)un++;sl.push(`· ${s.key} ${s.set.title} ${s.label}: ${x?LAB[x.s]:'미표시'}${r.note?' / '+r.note:''}`);});
  if(ql.length){out.push('■ 확인 요청');out.push(...ql);}
  if(sl.length){out.push('■ 소재 섹션');out.push(...sl);}
  out.push(`미표시 ${un}건`);return out.join('\n');}
function chips(s){return `<ul class="files">${s.frames.map(f=>`<li><span class="mono">${esc(f.name)}</span><span class="sub">${f.w}x${f.h} · ${f.ext}${f.cut?' · 배경 투명':''}${f.sub?' · '+esc(f.sub):''}</span></li>`).join('')}</ul>`;}
function section(s){
  const n=NODE[s.key];
  return `<article class="sec" id="sec_${s.key}">
   <div class="secmeta"><div class="t"><b>${esc(s.label)}</b><span class="rule${s.warn?' warn':''}">${esc(s.rule)}</span><span class="mute num">${s.frames.length}장</span><span class="code">${s.key}</span></div>
   <dl><dt>광고그룹</dt><dd>${esc(s.group)}</dd><dt>랜딩</dt><dd>${esc(s.set.landing)}</dd><dt>기간</dt><dd>${esc(s.set.period)}</dd><dt>광고 문구</dt><dd class="mute">작성 중</dd></dl></div>

   <div class="live">${n?`<iframe class="fig" src="${embUrl(n)}" loading="lazy" allowfullscreen title="${esc(s.set.title+' '+s.label)} Figma 실시간 화면"></iframe><div class="livebar"><span class="mute">Figma 실시간 화면 · 확대 · 이동 가능</span><a href="${figUrl(n)}" target="_blank" rel="noopener">Figma에서 열기</a></div>`:''}${chips(s)}</div>${note(s.key,['md','growth'])}</article>`;
}
function statsHTML(){const m=me?mine():null;return `<div class="stat"><b>${ALLFRAMES.length}<span class="mute" style="font-size:13px;font-weight:400">장</span></b><span>준비 소재</span></div><div class="stat"><b>${Q.length}</b><span>확인 요청</span></div><div class="stat"><b>${ALLSECS.length}</b><span>소재 섹션</span></div>${m?`<div class="stat"><b>${m.marked}/${m.total}</b><span>내 표시</span></div><div class="stat${m.fix?' fix':''}"><b>${m.fix}</b><span>수정 필요</span></div>`:''}`;}
function meHTML(){return `<span class="lbl">내 역할</span><span class="seg" role="group" aria-label="내 역할">${['md','growth'].map(r=>`<button data-a="me" data-r="${r}" aria-pressed="${me===r}">${r==='md'?'온라인팀 MD':'그로스팀'}</button>`).join('')}</span><button class="copy" data-a="copy" ${me?'':'disabled'}>회신 내용 복사</button>${flash?`<span class="flash">${esc(flash)}</span>`:''}${outText?`<pre class="notetext" style="flex-basis:100%;user-select:all">${esc(outText)}</pre>`:''}`;}
function refreshCtrl(k){document.querySelectorAll(`[data-ctrl="${k}"]`).forEach(el=>{el.innerHTML=ctrl(k,el.dataset.roles.split(','),!el.dataset.nolabel);});const st=document.getElementById('stats');if(st)st.innerHTML=statsHTML();}
function refreshMe(){const el=document.getElementById('me');if(el)el.innerHTML=meHTML();}
function render(){
  const T=TABS.find(t=>t.id===tab)||TABS[0]; const m=me?mine():null;
  const app=document.getElementById('app');

  app.innerHTML=`<div class="wrap">
  <header class="head"><span class="eyebrow">MIND BRIDGE · 2026 네이버 넾다세일</span><h1>광고 소재 사전 확인<span class="draft">DRAFT</span></h1>
   <p class="mute">준비 중인 광고 소재 구성이 맞는지 미리 확인하는 페이지입니다. 섹션마다 Figma 작업 화면이 실시간으로 보입니다. 내 역할을 고르고 항목별로 확인 또는 수정 필요를 표시한 뒤, 회신 내용 복사로 메신저에 보내주세요. 표시는 이 기기에만 저장됩니다.</p>
   <div class="stats" id="stats">${statsHTML()}</div></header>
  <section class="me" id="me" aria-label="내 역할">${meHTML()}</section>
  <section class="panel" aria-label="일정"><div class="sched">${SCHED.map(x=>{const past=(x.m<today.m)||(x.m===today.m&&x.d<today.d);return `<div class="${x.key?'key ':''}${past?'past':''}"><span class="d">${x.t}</span><span class="mute">${x.l}</span></div>`;}).join('')}</div></section>
  <section class="panel" aria-labelledby="qh"><div class="qhead"><h2 id="qh">확인 요청 <small>${Q.length}건</small></h2><span class="mode">${me?ROLE[me]+' 항목만 표시 가능':'내 역할을 먼저 골라주세요'}</span></div>
   <div class="qlist">${Q.map(q=>`<div class="q"><span class="who">${ROLE[q.role]}</span><div class="qt"><b>${QID(q)} ${esc(q.t)}</b><p>${esc(q.d)}</p></div><div class="ctrl" data-ctrl="${q.key}" data-roles="${q.role}" data-nolabel="1">${ctrl(q.key,[q.role],false)}</div>${note(q.key,[q.role])}</div>`).join('')}</div></section>
  <section class="panel" aria-labelledby="sh"><h2 id="sh">소재 구성 <small>섹션 ${ALLSECS.length}개 · 섹션별 확인</small></h2>
   <div class="tabs" role="tablist">${TABS.map(t=>`<button role="tab" data-a="tab" data-t="${t.id}" aria-selected="${t.id===T.id}">${esc(t.label)}<span class="n">${t.count}</span></button>`).join('')}</div>
   <p class="tabnote">${T.note?esc(T.note)+' ':''}<a href="${figUrl(PAGE[T.id])}" target="_blank" rel="noopener">이 탭 Figma 페이지 전체 보기</a></p>
   ${T.sets.map(st=>`<div class="set"><div class="sethead"><h3>${esc(st.title)}</h3>${st.sub?`<span class="mono">${esc(st.sub)}</span>`:''}<span class="mute">${esc(st.landing)} · ${esc(st.period)}</span></div>${T.secs.filter(s=>s.set===st).map(section).join('')}</div>`).join('')}
  </section>
  <section class="info">
   <div class="panel"><h2>규격 · 공통 규칙</h2><div class="tbl"><table><thead><tr><th>형식</th><th>사이즈</th><th>이미지 내 글자</th><th>파일</th></tr></thead><tbody>
    <tr><td>GFA IMG</td><td class="num">750x500 · 260x280 누끼</td><td class="warn">금지</td><td>jpg · 누끼 png</td></tr>
    <tr><td>GFA Native</td><td class="num">342x228 · 1200x628 · 1200x1200 · 1200x1800</td><td class="warn">금지</td><td>jpg</td></tr>
    <tr><td>GFA NativeFeed</td><td class="num">1200x628 · 1200x1200 · 1200x1800</td><td>허용 · 분할 불가</td><td>jpg</td></tr>
    <tr><td>Meta</td><td class="num">1000x1000</td><td>규정 미기재</td><td>jpg</td></tr>
    <tr><td>Google 디맨드젠</td><td class="num">1200x628 · 1200x1200 · 960x1200</td><td>규정 미기재</td><td>jpg</td></tr>
    <tr><td>로고</td><td class="num">300x300 · 112x112 · 1200x1200</td><td>로고 단독</td><td>jpg</td></tr></tbody></table></div>
    <div class="tbl"><table><tbody>
    <tr><td>할인 · 쿠폰 문구</td><td>IMG · Native는 이미지에 넣지 않고 광고 문구로 처리</td></tr>
    <tr><td>가격 · 할인율</td><td>랜딩 세일가와 일치</td></tr>
    <tr><td>쿠폰 소재</td><td>11/1(일)부터 노출, 소진 시 OFF</td></tr>
    <tr><td>랜딩</td><td>네이버 쇼핑 인랜딩만 집행액 집계</td></tr>
    <tr><td>파일명</td><td>카드의 파일명 그대로 업로드</td></tr></tbody></table></div></div>
   <div class="panel"><h2>확정 대기</h2><div class="tbl"><table><thead><tr><th>항목</th><th>상태</th></tr></thead><tbody>
    <tr><td>세일가 · 할인율</td><td>온라인팀 확인 중</td></tr>
    <tr><td>리워드 쿠폰 할인 조건</td><td>온라인팀 확인 중</td></tr>
    <tr><td>랜딩 URL</td><td>온라인팀 확인 중</td></tr>
    <tr><td>넾다세일 KV · 쇼핑 지면 가이드</td><td>네이버 배포 대기</td></tr>
    <tr><td>N페이 소재 규격</td><td>네이버 부킹 메일 대기</td></tr>
    <tr><td>광고 문구 (헤드라인 · 설명)</td><td>마케팅팀 작성 중</td></tr>
    <tr><td>이미지 소스</td><td>마케팅팀 정리 중</td></tr></tbody></table></div>
    <p class="foot">원천: 그로스팀 미디어믹스 v1 (261008) 매체별 소재 사이즈 표 · 운영안 261014 · 네이버 N그로스 패키지 안내. 기준일 ${S.base}.</p></div>
  </section>
  </div>`;
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel);}catch(e){}}}
}
async function copyReply(){const t=replyText();
  try{await navigator.clipboard.writeText(t);flash='복사됨. 메신저에 붙여넣어 보내주세요';outText='';}
  catch(e){flash='자동 복사가 안 돼 아래 내용을 직접 복사해 주세요';outText=t;}
  refreshMe();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='tab'){tab=b.dataset.t;try{localStorage.setItem('nepda_tab',tab);}catch(x){}render();return;}
  if(a==='me'){me=b.dataset.r;flash='';outText='';persist();render();return;}
  if(a==='mark'&&me===b.dataset.r){const r=rv(b.dataset.k),v=b.dataset.v;
    if(r[me]&&r[me].s===v)delete r[me];else r[me]={s:v};flash='';persist();refreshCtrl(b.dataset.k);return;}
  if(a==='copy'&&me){copyReply();return;}
});
document.addEventListener('input',e=>{const t=e.target;if(!t.matches('textarea[data-k]'))return;const r=rv(t.dataset.k);const v=t.value.trim();if(v)r.note=v;else delete r.note;persist();});
render();
})();

</script>
