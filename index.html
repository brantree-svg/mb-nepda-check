*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: 한 열 작업 보드. 상단 요약, 확인 요청 목록, 탭별 소재 구성, 하단 규격 */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --ink:#161616; --mute:#6A6A66; --line:#E0E0DC; --soft:#ECECE8;
  --ph:#D9D9D4; --red:#D02A1B; --ok:#1C7646; --okbg:#E5F1EA; --fixbg:#FBE8E5; --focus:#161616;
  --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:ui-monospace,'SF Mono',Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121211; --surface:#1B1B1A; --ink:#ECECE9; --mute:#9B9B96; --line:#2F2F2D; --soft:#252523;
  --ph:#3A3A37; --red:#FF6B57; --ok:#62CC93; --okbg:#173222; --fixbg:#3B1D18; --focus:#ECECE9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1B1B1A; --ink:#ECECE9; --mute:#9B9B96; --line:#2F2F2D; --soft:#252523;
  --ph:#3A3A37; --red:#FF6B57; --ok:#62CC93; --okbg:#173222; --fixbg:#3B1D18; --focus:#ECECE9; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;letter-spacing:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px;display:flex;flex-direction:column;gap:40px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:28px;line-height:1.25}
h2{font-size:18px;display:flex;align-items:baseline;gap:10px}
h2 small{font-size:13px;color:var(--mute);font-weight:400}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.mono{font-family:var(--mono);font-size:12.5px}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.head{display:flex;flex-direction:column;gap:10px}
.head p{margin:0;max-width:68ch}
.stats{display:flex;flex-wrap:wrap;gap:12px 32px;padding-top:6px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.stat.fix b{color:var(--red)}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--ink)}
.sched div{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.sched .d{font-variant-numeric:tabular-nums;font-weight:600}
.sched .key .d{color:var(--red)}
.sched .past{opacity:.45}
.panel{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.mode{font-size:12px;color:var(--mute)}
.mode.on{color:var(--ok)}
.qlist{border-top:1px solid var(--ink)}
.q{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.who{font-size:12px;font-weight:600;padding:2px 8px;border:1px solid var(--line);border-radius:999px;justify-self:start;white-space:nowrap}
.qt{min-width:0}
.qt b{font-weight:600}
.qt p{margin:2px 0 0;color:var(--mute);font-size:13px}
.q .note{grid-column:2/4}.sec .note{grid-column:1/-1}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.ctrl .role{font-size:12px;color:var(--mute);margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].ok{background:var(--okbg);color:var(--ok);font-weight:600}
.seg button[aria-pressed="true"].fix{background:var(--fixbg);color:var(--red);font-weight:600}
.state{font-size:12.5px;padding:3px 10px;border-radius:6px;background:var(--soft);color:var(--mute);white-space:nowrap}
.state.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.state.fix{background:var(--fixbg);color:var(--red);font-weight:600}
.at{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:38px;resize:vertical;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.notetext{font-size:13px;margin:0;padding:8px 10px;background:var(--soft);border-radius:6px;white-space:pre-wrap}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ink);padding-top:6px}
.tabs button{border:0;background:transparent;padding:8px 12px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mute)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tabs .n{font-variant-numeric:tabular-nums;font-size:12px;margin-left:4px}
.tabnote{margin:0;font-size:13px;color:var(--mute)}
.set{display:flex;flex-direction:column;gap:12px}
.sethead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding-top:8px}
.sethead h3{font-size:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 16px}
.secmeta{display:flex;flex-direction:column;gap:6px;min-width:0}
.secmeta .t{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.secmeta .t b{font-size:15px}
.rule{font-size:12.5px;font-weight:600}
.rule.warn{color:var(--red)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:0;font-size:13px}
dt{color:var(--mute)}
dd{margin:0;min-width:0}
.sec .ctrl{flex-direction:column;align-items:flex-end;gap:8px}
.sec .ctrl .line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cards{grid-column:1/3;display:flex;flex-wrap:wrap;gap:18px 20px;align-items:flex-end;padding-top:4px}
.card{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:100%}
.thumb{height:110px;display:flex;align-items:flex-end}
.box{height:110px;background:var(--ph);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;max-width:100%}
.box.cut{background:repeating-conic-gradient(var(--ph) 0 25%,transparent 0 50%) 0 0/12px 12px;outline:1px dashed var(--mute);outline-offset:-1px}
.box img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.cap{display:flex;flex-direction:column;gap:2px}
.cap .mono{word-break:break-all}
.cap .sub{font-size:12px;color:var(--mute)}
.pill{align-self:flex-start;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--mute)}
.pill.final{background:var(--okbg);color:var(--ok)}
.pill.revise{background:var(--fixbg);color:var(--red)}
.dl{align-self:flex-start;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px;font-size:12px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:400;color:var(--mute);font-size:12px;padding:0 12px 6px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.warn{color:var(--red);font-weight:600}
.foot{font-size:12px;color:var(--mute)}
@media (max-width:720px){
  .q{grid-template-columns:minmax(0,1fr)}
  .q .note,.sec .note{grid-column:1}
  .ctrl{justify-content:flex-start}
  .sec{grid-template-columns:minmax(0,1fr)}
  .sec .ctrl{align-items:flex-start}
  .sec .ctrl .line{justify-content:flex-start}
  .cards{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.draft{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.06em;border:1px solid var(--ink);padding:1px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.me .lbl{font-weight:600}
.me .seg button{padding:6px 14px;font-size:13px}
.me .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.copy{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;padding:6px 14px;font-weight:600}

.live{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;min-width:0}
.fig{width:100%;height:440px;border:1px solid var(--line);border-radius:6px;background:var(--soft);display:block}
.livebar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:12px}
.livebar a,.tabnote a{color:var(--ink);font-weight:600}
.files{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 16px}
.files li{display:flex;flex-direction:column;min-width:0;padding:6px 0;border-top:1px solid var(--line)}
.files .mono{word-break:break-all}
.files .sub{font-size:12px;color:var(--mute)}
@media (max-width:720px){.live{grid-column:1}.fig{height:300px}}

.stab{min-width:780px}.stab td{white-space:normal!important}.stab td:first-child{white-space:nowrap!important}
.st{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
